services:
  orkestro-db-master:
    container_name: orkestro-db-master
    restart: always
    ports:
      - "5432:5432"
    build:
      context: ./database
      args:
        - POSTGRES_DB=$POSTGRES_DB
        - INCLUDE_TEST_DATA=$INCLUDE_TEST_DATA
        - POSTGRES_SLAVE_USER=$POSTGRES_SLAVE_USER
        - POSTGRES_SLAVE_PASSWORD=$POSTGRES_SLAVE_PASSWORD
    env_file:
      - .env
    environment:
      - POSTGRES_USER=$POSTGRES_MASTER_USER
      - POSTGRES_PASSWORD=$POSTGRES_MASTER_PASSWORD
    volumes:
      - "pgdata_master_volume:/var/lib/postgresql/data"

  orkestro-db-slave-setup:
    container_name: orkestro-db-slave-setup
    restart: no
    ports:
      - "5433:5432"
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=$POSTGRES_SLAVE_USER
      - POSTGRES_PASSWORD=$POSTGRES_SLAVE_PASSWORD
      - PGUSER=$POSTGRES_SLAVE_USER
      - PGPASSWORD=$POSTGRES_SLAVE_PASSWORD
      - PGHOST=$POSTGRES_MASTER_HOST
      - PGPORT=$POSTGRES_MASTER_PORT
    command: "/bin/sh -c 'until pg_basebackup -D /var/lib/postgresql/data -w -R ; do sleep 1 ; done'"
    volumes:
      - "pgdata_slave_volume:/var/lib/postgresql/data"

  orkestro-db-slave:
    container_name: orkestro-db-slave
    restart: always
    ports:
      - "5433:5432"
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=$POSTGRES_SLAVE_USER
      - POSTGRES_PASSWORD=$POSTGRES_SLAVE_PASSWORD
      - PGUSER=$POSTGRES_SLAVE_USER
      - PGPASSWORD=$POSTGRES_SLAVE_PASSWORD
      - PGHOST=$POSTGRES_MASTER_HOST
      - PGPORT=$POSTGRES_MASTER_PORT
    volumes:
      - "pgdata_slave_volume:/var/lib/postgresql/data"

  orkestro-backend-migrate:
    container_name: orkestro-backend-migrate
    restart: on-failure
    ports:
      - "8000:8000"
    build:
      context: ./backend
      args:
        - DJANGO_KEY=$DJANGO_KEY
    env_file:
      - .env
    command: "/bin/sh -c 'python3 manage.py migrate'"

  orkestro-backend:
    container_name: orkestro-backend
    restart: always
    ports:
      - "8000:8000"
    build:
      context: ./backend
      args:
        - DJANGO_KEY=$DJANGO_KEY
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: "gunicorn orkestro.wsgi:application --bind 0.0.0.0:8000 --workers $DJANGO_WORKERS"

  orkestro-frontend:
    container_name: orkestro-frontend
    restart: always
    ports:
      - "5000:5000"
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        - BACKEND_HOSTS=$BACKEND_HOSTS
        - REACT_APP_GOOGLE_CLIENT_ID=$REACT_APP_GOOGLE_CLIENT_ID
        - USE_HTTPS=$USE_HTTPS
    env_file:
      - .env

volumes:
  pgdata_master_volume: {}
  pgdata_slave_volume: {}
