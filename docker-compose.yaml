services:
  backend:
    build:
      context: ./backend
    command: gunicorn orkestro.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
    expose:
      - 8000
    ports:
      - "8000:8000"
    depends_on:
      - db-master
    env_file:
      - ./.env/backend.env
    restart: always

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend/build:/usr/share/nginx/html
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  db-master:
    build:
      context: ./database/master
    env_file:
      - ./.env/db-master.env
    ports:
      - "5432:5432"
    volumes:
      - "master_data:/var/lib/postgresql/data"

  # db-slave:
  #   build:
  #     context: ./database/slave
  #   container_name: db-slave
  #   env_file:
  #     - ./.env/db-slave.env
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - "slave_data:/var/lib/postgresql/data"
  #   depends_on:
  #     - db-master

volumes:
  master_data:
  slave_data:
