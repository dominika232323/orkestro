services:
  db-master:
    build:
      context: ./database/master
    container_name: db-master
    env_file:
      - ./.env/db-master.env
    ports:
      - "5432:5432"
    volumes:
      - "master_data:/var/lib/postgresql/data"

  db-slave:
    build:
      context: ./database/slave
    container_name: db-slave
    env_file:
      - ./.env/db-slave.env
    ports:
      - "5433:5432"
    volumes:
      - "slave_data:/var/lib/postgresql/data"
    depends_on:
      - db-master

volumes:
  master_data:
  slave_data:
