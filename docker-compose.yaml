version: "3.3"

services:
  orkestro-db-master:
    build:
      context: ./database/master
    container_name: orkestro-db-master
    env_file:
      - ./.env/db.env
    ports:
      - "5432:5432"
    volumes:
      - "./databse/master:/var/lib/postgresql/data"

  orkestro-db-slave:
    build:
      context: ./database/slave
    container_name: orkestro-db-slave
    env_file:
      - ./.env/db.env
    ports:
      - "5433:5432"
    volumes:
      - "./databse/slave:/var/lib/postgresql/data"
    depends_on:
      - orkestro-db-master
