services:
  orkestro-db-master:
    container_name: orkestro-db-master
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    build:
      context: .
      dockerfile: database/dockerfile_master
      args:
        - POSTGRES_USER=$POSTGRES_USER
        - POSTGRES_DB=$POSTGRES_DB
        - INCLUDE_TEST_DATA=$INCLUDE_TEST_DATA
    volumes:
      - "pgdata_volume:/var/lib/postgresql/data"

      
