services:
  orkestro-db-master:
    container_name: orkestro-db-master
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    build:
      context: .
      dockerfile: database/dockerfile_master
      args:
        - POSTGRES_DB=$POSTGRES_DB
        - INCLUDE_TEST_DATA=$INCLUDE_TEST_DATA
        - POSTGRES_SLAVE_USER=$POSTGRES_SLAVE_USER
        - POSTGRES_SLAVE_PASSWORD=$POSTGRES_SLAVE_PASSWORD
    environment:
      - POSTGRES_USER=$POSTGRES_MASTER_USER
      - POSTGRES_PASSWORD=$POSTGRES_MASTER_PASSWORD
    volumes:
      - "pgdata_master_volume:/var/lib/postgresql/data"

  orkestro-db-slave-setup:
    container_name: orkestro-db-slave
    restart: no
    env_file:
      - .env
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=$POSTGRES_SLAVE_USER
      - POSTGRES_PASSWORD=$POSTGRES_SLAVE_PASSWORD
      - PGUSER=$POSTGRES_SLAVE_USER
      - PGPASSWORD=$POSTGRES_SLAVE_PASSWORD
      - PGHOST=$DJANGO_DB_MASTER_HOST
      - PGPORT=$DJANGO_DB_MASTER_PORT
    volumes:
      - "pgdata_slave_volume:/var/lib/postgresql/data"
    image: postgres:17-alpine
    command: "/bin/sh -c 'until pg_basebackup -D /var/lib/postgresql/data -w -R ; do sleep 1 ; done'"

  orkestro-db-slave:
    container_name: orkestro-db-slave
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=$POSTGRES_SLAVE_USER
      - POSTGRES_PASSWORD=$POSTGRES_SLAVE_PASSWORD
      - PGUSER=$POSTGRES_SLAVE_USER
      - PGPASSWORD=$POSTGRES_SLAVE_PASSWORD
      - PGHOST=$DJANGO_DB_MASTER_HOST
      - PGPORT=$DJANGO_DB_MASTER_PORT
    volumes:
      - "pgdata_slave_volume:/var/lib/postgresql/data"
    image: postgres:17-alpine

  orkestro-backend-migrate:
    container_name: orkestro-backend
    restart: no
    env_file:
      - .env
    ports:
      - "8000:8000"
    build:
      context: ./backend
      args:
        - DJANGO_KEY=$DJANGO_KEY
    command: "/bin/sh -c 'python3 manage.py migrate'"

  orkestro-backend:
    container_name: orkestro-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    build:
      context: ./backend
      args:
        - DJANGO_KEY=$DJANGO_KEY
    command: "gunicorn orkestro.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  orkestro-frontend:
    container_name: orkestro-frontend
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        - REACT_APP_GOOGLE_CLIENT_ID=$REACT_APP_GOOGLE_CLIENT_ID
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/chain.pem:/etc/nginx/conf.d/chain.pem:ro
      - ./nginx/privkey.pem:/etc/nginx/conf.d/privkey.pem:ro
      - ./nginx/fullchain.pem:/etc/nginx/conf.d/fullchain.pem:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata_master_volume: {}
  pgdata_slave_volume: {}
