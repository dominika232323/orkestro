  orkestro-backend:
    container_name: orkestro-backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    build:
      context: ./backend
      args:
        - POSTGRES_USER=$POSTGRES_USER
        - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        - POSTGRES_DB=$POSTGRES_DB
        - DJANGO_DB_HOST=$DJANGO_DB_HOST
        - DJANGO_DB_PORT=$DJANGO_DB_PORT
        - DJANGO_KEY=$DJANGO_KEY
        - DJANGO_DEBUG=$DJANGO_DEBUG
        - REACT_APP_GOOGLE_CLIENT_ID=$REACT_APP_GOOGLE_CLIENT_ID
        - DOMAIN=$DOMAIN
        - IP=$IP
    depends_on:
      - orkestro-db-master

  orkestro-frontend:
    container_name: orkestro-frontend
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        - REACT_APP_GOOGLE_CLIENT_ID=$REACT_APP_GOOGLE_CLIENT_ID
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/chain.pem:/etc/nginx/conf.d/chain.pem:ro
      - ./nginx/privkey.pem:/etc/nginx/conf.d/privkey.pem:ro
      - ./nginx/fullchain.pem:/etc/nginx/conf.d/fullchain.pem:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orkestro-backend

volumes:
  pgdata_volume: {}
  pgdata_slave_volume: {}
